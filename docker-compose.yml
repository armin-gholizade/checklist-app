services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: checklist
      POSTGRES_PASSWORD: checklist_local
      POSTGRES_DB: checklist
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - checklist_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checklist"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  checklist_data:
